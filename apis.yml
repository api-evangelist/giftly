aid: giftly
name: Giftly
description: >-
  Giftly is a digital gifting platform that lets anyone send a flexible monetary
  gift redeemable at a specific local or national business, or as cash. Senders
  pick a place or category, customize the card design and tagline, choose a gift
  amount up to $1,000, and deliver it by email, text, print, or mail. Recipients
  redeem a Giftly gift as a Visa or Mastercard gift card by mail, as a credit to
  their bank account, or as a credit to their PayPal account; gifts never expire
  and carry no inactivity fees. Giftly also runs a corporate and business program
  for companies sending gifts at scale. This profile was added to the API
  Evangelist network as a portfolio company of Uncork Capital; Giftly publishes a
  consumer web product and a business portal, but no public developer API,
  OpenAPI, or well-known discovery surface was found during enrichment.
